name: Publish Precifica 3D

on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify deterministic pricing math
        run: python3 scripts/verify_math.py
      - name: Install UI test dependency
        run: npm install --no-save jsdom@24
      - name: Run browser-like UI smoke test
        run: node scripts/smoke_ui.mjs
      - name: Verify required calculator functions
        run: |
          grep -q "function erate" app.js
          grep -q "function resultAt" app.js
          grep -q "function priceFor" app.js
          grep -q "function productionSummary" app.js
          grep -q "function failRate" app.js
          grep -q "function post" app.js
      - name: Prepare site
        run: |
          mkdir -p dist
          cp index.html style.css app.js market.js ui.js tariffs.json dist/
      - name: Refresh ANEEL residential tariff snapshot
        continue-on-error: true
        run: python3 scripts/build_tariffs.py
      - name: Verify tariff fallback exists
        run: test -s dist/tariffs.json
      - name: Publish gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
